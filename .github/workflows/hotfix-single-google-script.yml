name: Hotfix single Google Apps Script

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/hotfix-single-google-script.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch single Code.gs
        shell: python
        run: |
          from pathlib import Path

          path = Path("google-apps-script-single/Code.gs")
          text = path.read_text(encoding="utf-8")

          text = text.replace("const DNP_VERSION = '3.7.6';", "const DNP_VERSION = '3.7.7';", 1)

          old_merge = """  // Объединяем первые пять ячеек последней строки справа налево.\n  // В итоге остаются две ячейки: большая с надписью и отдельная с суммой.\n  const totalRow = table.getRow(table.getNumRows() - 1);\n  for (let cellIndex = 4; cellIndex >= 1; cellIndex--) {\n    totalRow.getCell(cellIndex).merge();\n  }\n\n  const labelCell = totalRow.getCell(0);\n  const amountCell = totalRow.getCell(1);"""
          new_merge = """  // Объединяем ячейки 1–5. TableCell.merge() объединяет текущую\n  // ячейку с предыдущей, поэтому четыре раза объединяем вторую ячейку\n  // с первой. Последний, шестой столбец остаётся отдельным для суммы.\n  const totalRow = table.getRow(table.getNumRows() - 1);\n  for (let mergeIndex = 0; mergeIndex < 4; mergeIndex++) {\n    totalRow.getCell(1).merge();\n  }\n\n  const labelCell = totalRow.getCell(0);\n  const amountCell = totalRow.getCell(1);"""
          if old_merge not in text:
              raise SystemExit("Не найден старый блок объединения итоговой строки")
          text = text.replace(old_merge, new_merge, 1)

          old_replacements = """      const replacements = {\n        '{{PLOT}}': plot,\n        '{{YEAR}}': String(year),\n        '{{MONTH}}': String(month).padStart(2, '0'),\n        '{{MONTH_NAME}}': getRussianMonthName_(month),\n        '{{FIO}}': name,\n        '{{NAME_PART}}': name ? ', ' + name : '',\n      };"""
          new_replacements = """      const monthNumber = String(month).padStart(2, '0');\n      const monthName = getRussianMonthName_(month);\n      const replacements = {\n        // Новые метки.\n        '{{PLOT}}': plot,\n        '{{YEAR}}': String(year),\n        '{{MONTH}}': monthNumber,\n        '{{MONTH_NAME}}': monthName,\n        '{{FIO}}': name,\n        '{{NAME_PART}}': name ? ', ' + name : '',\n\n        // Совместимость со старыми шаблонами темы и текста письма.\n        '{{P}}': plot,\n        '{{Pi}}': plot,\n        '{{Y}}': String(year),\n        '{{M}}': monthName,\n        '{{MN}}': monthName,\n        '{{MM}}': monthNumber,\n        '{{F}}': name,\n      };"""
          if old_replacements not in text:
              raise SystemExit("Не найден блок меток письма")
          text = text.replace(old_replacements, new_replacements, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify hotfix
        run: |
          grep -F "const DNP_VERSION = '3.7.7';" google-apps-script-single/Code.gs
          grep -F "totalRow.getCell(1).merge();" google-apps-script-single/Code.gs
          grep -F "'{{P}}': plot" google-apps-script-single/Code.gs
          test ! -d google-apps-script

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-single-google-script.yml
          git add google-apps-script-single/Code.gs
          git commit -m "Fix total row and legacy mail markers in single script [skip ci]"
          git push
