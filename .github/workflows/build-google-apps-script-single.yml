name: Finalize Google Apps Script Single File

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "google-apps-script/**"
      - "tools/build_google_apps_script_single.py"
      - ".github/workflows/build-google-apps-script-single.yml"

permissions:
  contents: write

jobs:
  finalize-single-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current single Code.gs
        run: python tools/build_google_apps_script_single.py

      - name: Verify final version and mail sender
        run: |
          grep -q "const DNP_VERSION = '3.7.6'" google-apps-script-single/Code.gs
          grep -q "function sendReceipts" google-apps-script-single/Code.gs
          if grep -q "Функция отправки квитанций будет подключена" google-apps-script-single/Code.gs; then
            echo "Old mail stub is still present"
            exit 1
          fi

      - name: Keep only the single-file Apps Script version
        run: |
          rm -rf google-apps-script
          rm -f tools/build_google_apps_script_single.py
          rm -f tools/update_payment_total_row.py

      - name: Commit final single-file version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A google-apps-script google-apps-script-single tools
          git commit -m "Keep only Google Apps Script single-file version" || exit 0
          git push
