name: Build Google Apps Script Single File

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "google-apps-script/**"
      - "tools/build_google_apps_script_single.py"
      - ".github/workflows/build-google-apps-script-single.yml"

permissions:
  contents: write

jobs:
  build-single-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build single Code.gs
        run: python tools/build_google_apps_script_single.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNP-Google-Apps-Script-single
          path: google-apps-script-single/Code.gs
          if-no-files-found: error

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script-single/Code.gs
          if git diff --cached --quiet; then
            echo "Generated file is already up to date."
          else
            git commit -m "Update single-file Google Apps Script [skip ci]"
            git push
          fi
